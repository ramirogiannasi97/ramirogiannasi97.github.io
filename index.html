<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramiro Giannasi Paid Media</title>
<meta name="description" content="Meta Ads and Google Ads management for ecommerce and lead-gen brands. Gestión de Meta Ads y Google Ads para ecommerce y captación de leads.">
<meta name="theme-color" content="#F7F2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: single-column editorial flow, 1120px wrap; hero splits copy / sample account readout; cases = 1 featured + 2x2 grid */
:root {
  --bg: #F7F2EC;
  --surface: #FFFDFA;
  --ink: #16121C;
  --muted: #5C5664;
  --line: #EDE4DA;
  --accent: #6A0BB5;
  --accent-ink: #FFFDFA;
  --accent-soft: #F3E7FF;
  --bar: #EADAFF;
  color-scheme: light;
  --font-display: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-mono: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.3rem, 5.4vw, 4rem); }
h2 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); }
h3 { font-size: 1.3rem; line-height: 1.2; }
p { margin: 0; }
a { color: inherit; }
.eyebrow {
  font-family: var(--font-body); font-weight: 600; font-size: 0.92rem; letter-spacing: 0;
  color: var(--accent); margin-bottom: 14px;
}
.muted { color: var(--muted); }
section { padding-block: 32px; }
.section-head { display: flex; flex-direction: column; gap: 14px; max-width: 700px; margin-bottom: 32px; }
.section-head p { color: var(--muted); }

/* focus */
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 0.98rem var(--font-body); text-decoration: none; cursor: pointer;
  padding: 14px 22px; border-radius: 999px; border: 1px solid transparent;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); }

/* header */
header.site {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.nav { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-decoration: none; display: flex; flex-direction: column; line-height: 1.1; margin-right: auto; }
.brand small { font: 500 0.76rem var(--font-body); color: var(--muted); margin-top: 3px; }
.nav-links { display: flex; gap: 22px; }
.nav-links a { text-decoration: none; font-size: 0.93rem; color: var(--muted); }
.nav-links a:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button {
  font: 600 0.82rem var(--font-body); border: 0; background: transparent; color: var(--muted);
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.nav .btn { padding: 10px 18px; font-size: 0.9rem; }
@media (max-width: 900px) { .nav-links { display: none; } }
@media (max-width: 560px) { .nav .btn { display: none; } .nav { gap: 12px; } }

/* hero */
.hero { padding-block: 72px 56px; }
.hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.hero-copy .lede { font-size: 1.14rem; color: var(--muted); max-width: 52ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-note { font-size: 0.88rem; color: var(--muted); }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } .hero { padding-block: 48px 40px; } }

.readout { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; min-width: 0; }
.readout-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.mono { font-family: var(--font-body); font-weight: 600; font-size: 0.82rem; color: var(--muted); }
.pill { font: 600 0.74rem var(--font-body); background: var(--accent-soft); color: var(--accent); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
.kpi .v { font: 600 1.45rem var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .v.hi { color: var(--accent); }
.kpi .l { font-size: 0.76rem; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.bars {
  display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 6px;
  background: repeating-linear-gradient(to top, transparent 0, transparent 32px, var(--line) 32px, var(--line) 33px);
}
.bars span { flex: 1; background: var(--bar); border-radius: 4px 4px 0 0; min-width: 0; }
.bars span:last-child { background: var(--accent); }
.bar-axis { display: flex; justify-content: space-between; margin-top: 8px; }

.tools { border-block: 1px solid var(--line); padding-block: 22px; }
.tools .wrap { display: flex; flex-direction: column; gap: 14px; }
.strip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px; }
.strip-row .mono { flex: 0 0 270px; }
.tools .brands li { font-size: 1.15rem; font-weight: 700; }
.tools .brands li:last-child { color: var(--muted); font-weight: 600; }
@media (max-width: 700px) { .strip-row .mono { flex-basis: 100%; } }
.tools ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 26px; }
.tools li { font: 600 0.95rem var(--font-display); }

/* plain words */
.plain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card p { color: var(--muted); font-size: 0.98rem; }
.card.tint { background: var(--accent-soft); border-color: transparent; }
.gloss { margin: 4px 0 0; display: grid; gap: 12px; }
.gloss dt { font: 600 0.95rem var(--font-mono); color: var(--accent); }
.gloss dd { margin: 0; font-size: 0.95rem; color: var(--ink); }
@media (max-width: 900px) { .plain-grid { grid-template-columns: 1fr; } section { padding-block: 24px; } }

/* cases */
.notice { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; font-size: 0.9rem; color: var(--muted); margin-bottom: 28px; max-width: 760px; }
.cases { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; transition: border-color .15s ease; }
.case:hover { border-color: var(--accent); }
.case.feature { grid-column: 1 / -1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 36px; }
.case-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.case-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.case dl { margin: 0; display: grid; gap: 10px; }
.case dt { font: 700 0.85rem var(--font-body); color: var(--accent); }
.case dd { margin: 2px 0 0; color: var(--muted); font-size: 0.96rem; }
.metrics { display: grid; gap: 14px; align-content: start; }
.case:not(.feature) .metrics { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border-top: 1px solid var(--line); padding-top: 18px; margin-top: auto; }
.case.feature .metrics { border-left: 1px solid var(--line); padding-left: 36px; }
.metric .ml { font-size: 0.8rem; color: var(--muted); }
.metric .mv { font: 600 1.5rem var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.case.feature .metric .mv { font-size: 2rem; }
@media (max-width: 900px) {
  .cases { grid-template-columns: 1fr; }
  .case.feature { grid-template-columns: 1fr; gap: 22px; }
  .case.feature .metrics { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 18px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
}

/* services */
.svc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.svc .best { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); }
.svc .best b { font: 700 0.85rem var(--font-body); color: var(--accent); display: block; margin-bottom: 2px; }
@media (max-width: 760px) { .svc-grid { grid-template-columns: 1fr; } }

/* process */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: s; }
.steps li { border-top: 2px solid var(--ink); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; counter-increment: s; min-width: 0; }
.steps li::before { content: "0" counter(s); font: 700 0.95rem var(--font-body); color: var(--accent); }
.steps p { color: var(--muted); font-size: 0.96rem; }
@media (max-width: 900px) { .steps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }

/* about */
.about { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 56px; align-items: center; }
.mono-block { aspect-ratio: 1; max-width: 100%; border-radius: 22px; background: var(--accent-soft); display: grid; place-items: center; font: 700 clamp(5rem, 14vw, 9rem) var(--font-display); letter-spacing: -0.04em; color: var(--accent); }
.about-copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.about-copy p { color: var(--muted); max-width: 56ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 0.85rem; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; }
.portrait { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 22%; border-radius: 22px; }
@media (max-width: 800px) { .about { grid-template-columns: 1fr; gap: 28px; } .portrait { max-width: 240px; } }

/* faq */
.faq { max-width: 800px; border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 22px 0; font: 600 1.12rem var(--font-display); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 500 1.5rem var(--font-mono); color: var(--accent); transition: transform .2s ease; flex: none; }
details[open] summary::after { transform: rotate(45deg); }
details p { color: var(--muted); padding: 0 40px 24px 0; max-width: 64ch; }

/* contact */
.contact { background: var(--accent-soft); color: var(--ink); border-radius: 28px; padding: clamp(32px, 6vw, 72px); display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.contact p { color: var(--muted); max-width: 52ch; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 0.95rem; }
.mail code { font: 500 0.95rem var(--font-mono); background: var(--surface); padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; user-select: all; }
.mail button { font: 600 0.82rem var(--font-body); background: transparent; color: var(--ink); border: 1px solid var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.mail button:hover { background: var(--surface); }

footer { padding-block: 40px; border-top: 1px solid var(--line); margin-top: 40px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 0.88rem; color: var(--muted); }
footer a { text-decoration: none; }
footer a:hover { color: var(--ink); }
</style>
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <a class="brand" href="#top" aria-label="Ramiro Giannasi Paid Media">Ramiro Giannasi<small data-i18n="brand_sub"></small></a>
    <nav class="nav-links" aria-label="Main">
      <a href="#work" data-i18n="nav_work"></a>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#process" data-i18n="nav_process"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" id="btn-es" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" id="btn-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="btn btn-primary js-book" href="#contact" data-i18n="cta_nav"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <div class="eyebrow" data-i18n="hero_eyebrow"></div>
        <h1 data-i18n="hero_h1"></h1>
        <p class="lede" data-i18n="hero_sub"></p>
        <div class="hero-actions">
          <a class="btn btn-primary js-book" href="#contact" data-i18n="cta_book"></a>
          <a class="btn btn-ghost" href="#work" data-i18n="hero_secondary"></a>
        </div>
        <p class="hero-note" data-i18n="hero_note"></p>
      </div>

      <aside class="readout" aria-label="Sample account readout">
        <div class="readout-top">
          <span class="mono" data-i18n="ro_label"></span>
          <span class="pill" data-i18n="tag_illustrative"></span>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="v" data-i18n="ro_spend_v"></div><div class="l" data-i18n="ro_spend"></div></div>
          <div class="kpi"><div class="v" data-i18n="ro_sales_v"></div><div class="l" data-i18n="ro_sales"></div></div>
          <div class="kpi"><div class="v hi" data-i18n="ro_roas_v"></div><div class="l">ROAS</div></div>
        </div>
        <div class="mono" style="margin-bottom:8px" data-i18n="ro_weeks"></div>
        <div class="bars" role="img" aria-label="ROAS by week: 1.8, 2.0, 2.2, 2.5, 2.7, 2.9, 3.0, 3.1">
          <span style="height:58%"></span><span style="height:64%"></span><span style="height:71%"></span><span style="height:81%"></span>
          <span style="height:87%"></span><span style="height:94%"></span><span style="height:97%"></span><span style="height:100%"></span>
        </div>
        <div class="bar-axis"><span class="mono" data-i18n="ro_lo"></span><span class="mono" data-i18n="ro_hi"></span></div>
      </aside>
    </div>
  </section>

  <div class="tools">
    <div class="wrap">
      <div class="strip-row">
        <span class="mono" data-i18n="exp_label"></span>
        <ul class="brands"><li>Microsoft</li><li>Nestlé</li><li data-i18n="exp_regional"></li></ul>
      </div>
      <div class="strip-row">
        <span class="mono" data-i18n="tools_label"></span>
        <ul><li>Meta Ads</li><li>Google Ads</li><li>Shopify</li><li>GA4</li><li>Google Tag Manager</li><li>Looker Studio</li></ul>
      </div>
    </div>
  </div>

  <section id="plain">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow" data-i18n="plain_eyebrow"></div>
        <h2 data-i18n="plain_h2"></h2>
      </div>
      <div class="plain-grid">
        <div class="card"><h3 data-i18n="pl1_t"></h3><p data-i18n="pl1_d"></p></div>
        <div class="card"><h3 data-i18n="pl2_t"></h3><p data-i18n="pl2_d"></p></div>
        <div class="card tint">
          <h3 data-i18n="pl3_t"></h3>
          <dl class="gloss">
            <div><dt>ROAS</dt><dd data-i18n="g_roas"></dd></div>
            <div><dt>CPA</dt><dd data-i18n="g_cpa"></dd></div>
            <div><dt>CPL</dt><dd data-i18n="g_cpl"></dd></div>
          </dl>
        </div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow" data-i18n="cases_eyebrow"></div>
        <h2 data-i18n="cases_h2"></h2>
      </div>
      <div class="notice" data-i18n="cases_note"></div>
      <div class="cases" id="cases"></div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow" data-i18n="svc_eyebrow"></div>
        <h2 data-i18n="svc_h2"></h2>
        <p data-i18n="svc_sub"></p>
      </div>
      <div class="svc-grid">
        <div class="card svc"><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p><div class="best"><b data-i18n="lbl_best"></b><span data-i18n="s1_b"></span></div></div>
        <div class="card svc"><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p><div class="best"><b data-i18n="lbl_best"></b><span data-i18n="s2_b"></span></div></div>
        <div class="card svc"><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p><div class="best"><b data-i18n="lbl_best"></b><span data-i18n="s3_b"></span></div></div>
        <div class="card svc"><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p><div class="best"><b data-i18n="lbl_best"></b><span data-i18n="s4_b"></span></div></div>
      </div>
    </div>
  </section>

  <section id="process">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow" data-i18n="proc_eyebrow"></div>
        <h2 data-i18n="proc_h2"></h2>
      </div>
      <ol class="steps">
        <li><h3 data-i18n="p1_t"></h3><p data-i18n="p1_d"></p></li>
        <li><h3 data-i18n="p2_t"></h3><p data-i18n="p2_d"></p></li>
        <li><h3 data-i18n="p3_t"></h3><p data-i18n="p3_d"></p></li>
        <li><h3 data-i18n="p4_t"></h3><p data-i18n="p4_d"></p></li>
      </ol>
    </div>
  </section>

<script>
(function () {
  // Edit these three values to go live.
  var CONFIG = {
    bookingUrl: "https://calendly.com/ramirogiannasi/30min",
    email: "ramirogiannasi@gmail.com",
    linkedin: "https://www.linkedin.com/in/ramiro-giannasi-477391144/"
  };

  var lang = "en";
  try {
    var saved = localStorage.getItem("lang");
    if (saved === "es" || saved === "en") lang = saved;
    else if ((navigator.language || "").toLowerCase().indexOf("es") === 0) lang = "es";
  } catch (e) {
    if ((navigator.language || "").toLowerCase().indexOf("es") === 0) lang = "es";
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function renderCases() {
    var d = I18N[lang], list = CASES[lang], html = "";
    list.forEach(function (k, i) {
      var metrics = k.m.map(function (x) {
        return '<div class="metric"><div class="ml">' + esc(x[0]) + '</div><div class="mv">' + esc(x[1]) + '</div></div>';
      }).join("");
      html += '<article class="case' + (i === 0 ? ' feature' : '') + '">' +
        '<div class="case-main">' +
          '<div class="case-meta"><span class="mono">' + esc(k.tag) + ' · ' + esc(k.period) + '</span><span class="pill">' + esc(d.tag_illustrative) + '</span></div>' +
          '<h3>' + esc(k.t) + '</h3>' +
          '<dl><div><dt>' + esc(d.lbl_challenge) + '</dt><dd>' + esc(k.c) + '</dd></div>' +
          '<div><dt>' + esc(d.lbl_action) + '</dt><dd>' + esc(k.a) + '</dd></div></dl>' +
        '</div>' +
        '<div class="metrics">' + metrics + '</div>' +
      '</article>';
    });
    document.getElementById("cases").innerHTML = html;
  }

  function apply() {
    var d = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (d[key] !== undefined) el.textContent = d[key];
    });
    document.getElementById("btn-es").setAttribute("aria-pressed", String(lang === "es"));
    document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("foot-left").textContent = d.foot_left;
    renderCases();
  }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("lang", lang); } catch (e) {}
      apply();
    });
  });

  // Booking links
  if (CONFIG.bookingUrl) {
    document.querySelectorAll(".js-book").forEach(function (a) {
      a.href = CONFIG.bookingUrl; a.target = "_blank"; a.rel = "noopener noreferrer";
    });
    var mainBtn = document.getElementById("book-main");
    mainBtn.href = CONFIG.bookingUrl; mainBtn.target = "_blank"; mainBtn.rel = "noopener noreferrer"; mainBtn.hidden = false;
  }
  if (CONFIG.linkedin) {
    var li = document.getElementById("foot-li"); li.href = CONFIG.linkedin; li.hidden = false;
  }

  // Email + copy
  var mailEl = document.getElementById("mail-text");
  mailEl.textContent = CONFIG.email;
  document.getElementById("copy-mail").addEventListener("click", function () {
    var btn = this, d = I18N[lang];
    function done() { btn.textContent = d.copied; setTimeout(function () { btn.textContent = I18N[lang].copy; }, 1600); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(mailEl);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    try {
      navigator.clipboard.writeText(CONFIG.email).then(done, fallback);
    } catch (e) { fallback(); }
  });

  apply();
})();
</script>
